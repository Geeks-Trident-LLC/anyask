[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anyask"
version = "0.2.0"
description = "Call an LLM provider with a single text prompt, get its raw text response back - one function, 18 vendors, zero routing/fallback magic"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

authors = [
    { name = "Tuyen Mathew Duong", email = "tuyen@geekstrident.com" }
]

maintainers = [
    { name = "Tuyen Mathew Duong", email = "tuyen@geekstrident.com" }
]

dependencies = [
    "PyYAML>=6.0",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",

    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",

    "Operating System :: OS Independent",
]

keywords = [
    "ai",
    "llm",
    "openai",
    "claude",
    "anthropic",
    "gemini",
    "azure-ai-inference",
    "deepseek",
    "groq",
    "xai",
    "grok",
    "together-ai",
    "fireworks-ai",
    "cerebras",
    "perplexity",
    "openrouter",
    "moonshot",
    "kimi",
    "mistral",
    "bedrock",
    "aws",
    "cohere",
    "vertex ai",
    "gcp",
    "oracle cloud infrastructure",
    "oci",
]

[project.optional-dependencies]
# ------------------------------------------------------------
# Per-provider extras: install only the SDK(s) a given provider needs,
# e.g. `pip install anyask[anthropic]`. Provider SDK imports are lazy
# (anyask/registry.py), so installing none of these still gives a fully
# working `ask()`/`get_provider()` API - just no provider can actually
# generate until its extra (or [all]) is installed.
# ------------------------------------------------------------
openai = ["openai>=1.0.0"]

# The following all reach their API through the OpenAI-compatible
# chat-completions surface (anyask/providers/openai_compat.py) and need
# nothing beyond the `openai` package itself.
deepseek = ["openai>=1.0.0"]
groq = ["openai>=1.0.0"]
xai = ["openai>=1.0.0"]
together = ["openai>=1.0.0"]
fireworks = ["openai>=1.0.0"]
cerebras = ["openai>=1.0.0"]
perplexity = ["openai>=1.0.0"]
openrouter = ["openai>=1.0.0"]
moonshot = ["openai>=1.0.0"]

anthropic = ["anthropic>=0.40.0"]

# gemini and vertexai both use google-genai's Client class, just
# constructed differently (api_key=... vs vertexai=True, project=, location=).
gemini = ["google-genai>=0.2.0"]
vertexai = ["google-genai>=0.2.0"]

azure = ["azure-ai-inference>=1.0.0b9"]

mistral = [
    # Pinned exactly: 1.10.0 is the last mistralai release supporting
    # Python 3.9 (1.10.1+ and all 2.x require Python >=3.10, which would
    # break this package's >=3.9 support).
    "mistralai==1.10.0",
]

bedrock = [
    # Pinned exactly for the same reason: 1.42.97 is the newest boto3
    # release with a Python 3.9-compatible botocore; boto3 bumps its
    # Python floor frequently across even small version bumps.
    "boto3==1.42.97",
]

cohere = [
    # Pinned exactly for the same reason: 5.21.1 is the last cohere
    # release supporting Python 3.9 (6.x/7.x require Python >=3.10).
    "cohere==5.21.1",
]

oci = [
    # Pinned exactly for reproducibility. Note: this is a much heavier
    # dependency than every other provider SDK here - ~36MB, since it's
    # Oracle's single all-services SDK (compute, storage, IAM, ...), not
    # a Generative-AI-only package (no such package exists on PyPI) -
    # plus crypto libs (cryptography, pyOpenSSL) needed for its
    # request-signing auth model.
    "oci==2.182.0",
]

# ------------------------------------------------------------
# `all`: every provider SDK. For "just give me everything" or a full
# dev/test environment (combine with `dev` - `pip install -e ".[all,dev]"`).
# ------------------------------------------------------------
all = [
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "google-genai>=0.2.0",
    "azure-ai-inference>=1.0.0b9",
    "mistralai==1.10.0",
    "boto3==1.42.97",
    "cohere==5.21.1",
    "oci==2.182.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
]

[project.scripts]
anyask = "anyask.cli:main"

[project.urls]
Homepage = "https://github.com/Geeks-Trident-LLC/anyask"
Repository = "https://github.com/Geeks-Trident-LLC/anyask"
Issues = "https://github.com/Geeks-Trident-LLC/anyask/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["anyask*"]
exclude = ["tests*", "docs*", "examples*", "scripts*"]

[tool.pytest.ini_options]
addopts = "-ra --cov=anyask --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests that require real API calls or external services",
]
filterwarnings = [
    "ignore::DeprecationWarning:google\\.genai\\.",
    "ignore::DeprecationWarning:cohere\\.",
]

[tool.coverage.report]
fail_under = 70

[tool.mypy]
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
fix = true
force-exclude = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "T100",
]

[tool.ruff.format]
exclude = ["**/*.py"]
